  - package-ecosystem: "pip"
    directory: "/crewai-external-orchestrate-agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    groups:
      all-dependencies:
        patterns: ["*"]
    labels:
      - "dependencies"

