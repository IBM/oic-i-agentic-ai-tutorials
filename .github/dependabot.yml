version: 2

# Security-only configuration.
#
# pip / npm: open-pull-requests-limit: 0 disables regular version-bump PRs.
#            Dependabot still opens PRs for CVE-driven security advisories
#            regardless of this limit — those bypass the cap entirely.
#
# npm:       allow: [{dependency-type: all}] is required on every npm entry
#            so that development-scoped transitive deps (lodash, svgo, etc.)
#            are included in security updates. Without it Dependabot silently
#            skips devDependency alerts.
#
# docker:    No Docker CVEs are present in the active security alerts.
#            Docker entries are omitted to avoid noise from base image bumps.
#
# uv.lock:   Dependabot reads pyproject.toml for direct deps in uv projects
#            but cannot update uv.lock transitive deps — those must be fixed
#            manually with: uv lock --upgrade-package <pkg>

updates:
