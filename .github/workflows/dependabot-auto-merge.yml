name: Dependabot auto-merge

# Security PRs (ghsa-id present)  → approve + merge automatically.
# Non-security PRs (no ghsa-id)   → close with an explanatory comment.
#
# Uses pull_request_target so this workflow is always read from main,
# not from the Dependabot PR branch.
# Uses --squash --admin for direct merge (no branch protection rules needed).

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and merge security PRs
        if: steps.metadata.outputs.ghsa-id != ''
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --admin "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close non-security PRs
        if: steps.metadata.outputs.ghsa-id == ''
        run: |
          gh pr close "$PR_URL" --comment "Closing: no CVE/GHSA advisory associated with this update. Only security-driven updates are auto-merged in this repo."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
