name: Dependabot auto-merge

# Approves and immediately merges every Dependabot PR.
# Safe because dependabot.yml sets open-pull-requests-limit: 0 for all
# pip/npm entries — Dependabot only opens a PR when a CVE/GHSA advisory
# exists. No security alert = no PR.
#
# Uses --squash (direct merge) rather than --auto because --auto requires
# at least one branch protection rule to queue against; without one GitHub
# rejects it with "pull request is in clean status".

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        run: gh pr merge --squash --admin "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
