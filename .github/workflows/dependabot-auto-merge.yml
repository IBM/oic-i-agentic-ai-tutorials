name: Auto-Merge Dependabot Security PRs

# Automatically approves and merges security-driven Dependabot PRs.
# Closes non-security (routine version bump) PRs with an explanatory comment.
#
# Key design decisions (see AGENTS.md for full rationale):
# - pull_request_target: reads workflow from main branch, not the PR branch,
#   so fixes pushed to main apply to all open Dependabot PRs immediately.
# - Two-signal security detection via gh CLI only (no fetch-metadata action):
#     1. 'security' label on the PR
#     2. CVE-YYYY-NNNNN or GHSA-* pattern found anywhere in the PR body
#   Avoids dependabot/fetch-metadata which fails hard on grouped PRs ("N updates").
# - --squash --admin: merges immediately without requiring branch protection rules.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-security:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Detect security signals
        id: security
        run: |
          # Signal 1: 'security' label on the PR
          HAS_LABEL=$(gh pr view "$PR_URL" --json labels \
            --jq '[.labels[].name] | contains(["security"])' 2>/dev/null || echo "false")

          # Signal 2: CVE or GHSA pattern in PR body
          BODY=$(gh pr view "$PR_URL" --json body --jq '.body' 2>/dev/null || echo "")
          if echo "$BODY" | grep -qiE '(CVE-[0-9]{4}-[0-9]+|GHSA-[a-z0-9]+-[a-z0-9]+-[a-z0-9]+)'; then
            HAS_CVE_IN_BODY="true"
          else
            HAS_CVE_IN_BODY="false"
          fi

          echo "has_label=$HAS_LABEL"            >> "$GITHUB_OUTPUT"
          echo "has_cve_in_body=$HAS_CVE_IN_BODY" >> "$GITHUB_OUTPUT"

          # Combined: any signal → is_security=true
          if [ "$HAS_LABEL" = "true" ] || [ "$HAS_CVE_IN_BODY" = "true" ]; then
            echo "is_security=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_security=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and merge security PR
        if: steps.security.outputs.is_security == 'true'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --admin "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close non-security PR with comment
        if: steps.security.outputs.is_security == 'false'
        run: |
          gh pr comment "$PR_URL" --body "$(cat <<'EOF'
          Thanks, Dependabot! 🤖

          This PR is a **routine version bump** with no associated CVE or security advisory, so it is being closed automatically per our policy.

          **Why?** Routine upgrades carry compatibility risk and are reviewed manually as part of planned maintenance — not auto-merged.

          **Security PRs** (those fixing a known CVE/GHSA, labelled \`security\`, or containing CVE references in the description) are merged automatically. To see open security alerts, visit the [Security tab](../../security/dependabot).
          EOF
          )"
          gh pr close "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
