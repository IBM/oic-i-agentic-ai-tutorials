##############################################################################
# sku_availability_toolkit.yaml
# MCP Toolkit spec for the sku-availability-checker.
# Import with: orchestrate toolkits import sku_availability_toolkit.yaml
##############################################################################

spec_version: v1
kind: mcp
name: sku-availability-checker
description: >
  Real-time inventory availability checker using Confluent Kafka and Apache Flink.
  Exposes get_sku_availability(sku, branch) and get_all_availability() tools that
  query the inventory.availability Kafka topic continuously updated by an Apache
  Flink aggregation pipeline on Confluent Cloud.
language: python
package_root: /Users/eladixit/Library/CloudStorage/Box-Box/MyWork/Code/Code-OIC/confluent_lab/oic-i-agentic-ai-tutorials/confluent-agents
command: python3 get_sku_availability.py
tools:
  - "*"
